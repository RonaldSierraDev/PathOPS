name: CI

# Runs on every PR, including from forks. No AWS credentials or secrets are
# referenced anywhere in this workflow -- that's deliberate, since fork PRs
# get their workflow runs approved automatically for public repos, and this
# job should be safe to run unattended regardless of who opened the PR.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pathml
          POSTGRES_PASSWORD: pathml
          POSTGRES_DB: pathml
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU-only torch/torchvision
        # Same reasoning as docker/Dockerfile: the default PyPI wheels bundle
        # CUDA/cuDNN and are ~6GB heavier than needed on a CPU-only runner.
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
