name: CI

# Runs on every PR, including from forks. No AWS credentials or secrets are
# referenced anywhere in this workflow -- that's deliberate, since fork PRs
# get their workflow runs approved automatically for public repos, and this
# job should be safe to run unattended regardless of who opened the PR.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  # The console is built inside docker/Dockerfile, so without this a type
  # error would only surface during the CD image build -- after merge.
  console:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install console dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check and build console
        working-directory: frontend
        run: npm run build # `tsc -b && vite build` -- type errors fail here

  lint-and-test:
    runs-on: ubuntu-latest

    env:
      # evidently's nltk dependency has an over-eager CWE-427 guard that false-
      # positives whenever site-packages resolves to a path nested under the
      # working directory (true of virtually any checked-out-repo + local-env
      # setup, including this runner's). Confirmed via inspection of nltk's own
      # inisec.py that this is exactly that documented false-positive case, not
      # a real vulnerability -- this is nltk's own official escape hatch for it.
      NLTK_DISABLE_IMPORT_SECURITY: "1"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pathml
          POSTGRES_PASSWORD: pathml
          POSTGRES_DB: pathml
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU-only torch/torchvision
        # Same reasoning as docker/Dockerfile: the default PyPI wheels bundle
        # CUDA/cuDNN and are ~6GB heavier than needed on a CPU-only runner.
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install package + dev dependencies
        run: pip install -e ".[dev,monitoring]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
