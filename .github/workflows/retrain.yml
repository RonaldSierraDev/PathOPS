name: Retrain

# Triggers:
#   - schedule: every Sunday at 02:00 UTC for autonomous weekly retraining
#   - workflow_dispatch: manual trigger with configurable hyperparameters
#
# Both run on the self-hosted runner (pathml-local), which needs to be on and
# registered for the job to execute. If the machine is off when the schedule
# fires, GitHub queues the job for up to 35 days and runs it when the runner
# comes back online.
#
# Security note: this workflow does NOT use the OIDC deploy role or any
# GitHub secret -- it relies on the AWS CLI credentials already configured
# locally on the runner machine. GitHub requires write access to fire
# workflow_dispatch; the schedule trigger is also protected because it only
# runs on the default branch (master), which fork PRs cannot push to.
on:
  schedule:
    - cron: "0 2 * * 0"  # 02:00 UTC every Sunday
  workflow_dispatch:
    inputs:
      epochs:
        description: "Training epochs"
        default: "3"
      batch_size:
        description: "Batch size"
        default: "64"
      lr:
        description: "Learning rate"
        default: "0.0001"
      tracking_uri:
        description: "MLflow tracking store (absolute path -- must match what scripts/promote_model.py reads from on this machine)"
        default: "sqlite:////home/ronald/projects/PathOPS/mlflow.db"

permissions:
  contents: read

jobs:
  retrain:
    runs-on: [self-hosted, pathml-local]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Download PCam dataset if not already cached
        run: |
          if [ ! -f data/pcam/camelyonpatch_level_2_split_train_x.h5 ]; then
            python scripts/download_pcam.py --data-dir data/pcam
          fi

      - name: Resolve the running API's current public IP
        id: api
        run: |
          TASK_ARN=$(aws ecs list-tasks --cluster "${{ vars.ECS_CLUSTER }}" --service-name "${{ vars.ECS_SERVICE }}" --query 'taskArns[0]' --output text)
          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "No running ECS task found -- skipping feedback blend (training on static PCam only)"
            echo "url=" >> "$GITHUB_OUTPUT"
          else
            ENI_ID=$(aws ecs describe-tasks --cluster "${{ vars.ECS_CLUSTER }}" --tasks "$TASK_ARN" --query 'tasks[0].attachments[0].details[?name==`networkInterfaceId`].value' --output text)
            PUBLIC_IP=$(aws ec2 describe-network-interfaces --network-interface-ids "$ENI_ID" --query 'NetworkInterfaces[0].Association.PublicIp' --output text)
            if [ -z "$PUBLIC_IP" ] || [ "$PUBLIC_IP" = "None" ]; then
              echo "Could not resolve public IP for task $TASK_ARN -- skipping feedback blend"
              echo "url=" >> "$GITHUB_OUTPUT"
            else
              echo "url=http://$PUBLIC_IP:8000/feedback/export" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Retrain, blending in feedback corrections
        env:
          # inputs.* are only set on workflow_dispatch; fall back to defaults
          # for the scheduled Sunday run.
          EPOCHS: ${{ inputs.epochs || '3' }}
          BATCH_SIZE: ${{ inputs.batch_size || '64' }}
          LR: ${{ inputs.lr || '0.0001' }}
          TRACKING_URI: ${{ inputs.tracking_uri || 'sqlite:////home/ronald/projects/PathOPS/mlflow.db' }}
          FEEDBACK_EXPORT_URL: ${{ steps.api.outputs.url }}
          FEEDBACK_IMAGES_S3_BUCKET: ${{ vars.S3_ARTIFACTS_BUCKET }}
        run: |
          FEEDBACK_ARGS=""
          if [ -n "$FEEDBACK_EXPORT_URL" ]; then
            FEEDBACK_ARGS="--feedback-export-url $FEEDBACK_EXPORT_URL --feedback-images-s3-bucket $FEEDBACK_IMAGES_S3_BUCKET"
          fi
          python -m pathml.training.train \
            --data-dir data/pcam \
            --epochs "$EPOCHS" \
            --batch-size "$BATCH_SIZE" \
            --lr "$LR" \
            --tracking-uri "$TRACKING_URI" \
            $FEEDBACK_ARGS

      - name: Next step (manual)
        run: |
          echo "Training complete and registered to MLflow under alias 'staging'."
          echo "This intentionally does NOT auto-promote -- review the run, then from your own machine run:"
          echo "  python scripts/promote_model.py --alias staging --s3-uri s3://${{ vars.S3_ARTIFACTS_BUCKET }}/models/pcam_resnet18.pt"
