[project]
name = "pathml"
version = "0.1.0"
description = "MLOps pipeline for histopathology cancer-patch classification (PatchCamelyon)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=0.9",
    "h5py>=3.10",
    "numpy>=1.26",
    "pillow>=10.0",
    "fastapi>=0.110",
    "pydantic>=2.0",
    "httpx>=0.27",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "mlflow>=3.0",
    "psycopg2-binary>=2.9",
    "matplotlib>=3.8",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.16",
]
# Kept out of the base install: evidently pulls in pandas/scipy/plotly/nltk,
# which would undo the effort put into keeping the ECS API image small.
# Only the drift-monitor Lambda (docker/Dockerfile.drift-monitor) and the
# baseline-computation script need this.
monitoring = [
    "evidently>=0.7",
    "pandas>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pathml"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.flake8-bugbear]
# FastAPI's own idiom is `param: T = File(...)` / `= Depends(...)` -- these
# calls are treated as immutable singletons per-request by FastAPI itself,
# so B008 (function-call-in-default-argument) doesn't apply here.
extend-immutable-calls = ["fastapi.File", "fastapi.Depends", "fastapi.Query", "fastapi.Body"]
